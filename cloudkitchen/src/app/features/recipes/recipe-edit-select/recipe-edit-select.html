<div class="container my-4">
  <div class="row justify-content-center">
    <div class="col-md-10">
      <div class="card shadow">
        <div class="card-header bg-warning text-dark text-center">
          <h4 class="mb-0">Edit Recipe</h4>
        </div>
        <div class="card-body">
          <!-- Loading State -->
          <div *ngIf="loading" class="text-center py-4">
            <div class="spinner-border text-warning" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>

          <!-- Error Message -->
          <div *ngIf="error" class="alert alert-danger" role="alert">
            {{ error }}
          </div>

          <!-- No Recipes -->
          <div *ngIf="!loading && recipes.length === 0" class="text-center py-4">
            <h5>No Recipes Available</h5>
            <p class="text-muted">There are no recipes to edit.</p>
            <a routerLink="/recipes/add" class="btn btn-primary">Add New Recipe</a>
          </div>

          <!-- Recipe Selection -->
          <div *ngIf="!loading && recipes.length > 0">
            <div class="mb-3">
              <label for="recipeSelect" class="form-label">Select Recipe:</label>
              <select
                class="form-select"
                id="recipeSelect"
                [(ngModel)]="selectedRecipeId"
                (change)="onRecipeSelect()">
                <option value="">Choose a recipe to edit...</option>
                <option
                  *ngFor="let recipe of recipes"
                  [value]="recipe.recipeId">
                  {{ recipe.title }} (by {{ recipe.chef }})
                </option>
              </select>
            </div>

            <!-- Edit Form -->
            <div *ngIf="showEditForm" id="editForm">
              <form (ngSubmit)="onSubmit()" #editForm="ngForm">
                <!-- Basic Info Section -->
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="title" class="form-label">Recipe Title</label>
                    <input
                      type="text"
                      class="form-control"
                      id="title"
                      name="title"
                      [(ngModel)]="formData.title"
                      required>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label for="chef" class="form-label">Chef Name</label>
                    <input
                      type="text"
                      class="form-control"
                      id="chef"
                      name="chef"
                      [(ngModel)]="formData.chef"
                      required>
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="cuisineType" class="form-label">Cuisine Type</label>
                    <select
                      class="form-select"
                      id="cuisineType"
                      name="cuisineType"
                      [(ngModel)]="formData.cuisineType"
                      required>
                      <option value="">Select cuisine type</option>
                      <option *ngFor="let cuisine of cuisineTypes" [value]="cuisine">{{ cuisine }}</option>
                    </select>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label for="mealType" class="form-label">Meal Type</label>
                    <select
                      class="form-select"
                      id="mealType"
                      name="mealType"
                      [(ngModel)]="formData.mealType"
                      required>
                      <option value="">Select meal type</option>
                      <option *ngFor="let meal of mealTypes" [value]="meal">{{ meal }}</option>
                    </select>
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-4 mb-3">
                    <label for="prepTime" class="form-label">Prep Time (minutes)</label>
                    <input
                      type="number"
                      class="form-control"
                      id="prepTime"
                      name="prepTime"
                      [(ngModel)]="formData.prepTime"
                      min="1"
                      max="480"
                      required>
                  </div>
                  <div class="col-md-4 mb-3">
                    <label for="difficulty" class="form-label">Difficulty</label>
                    <select
                      class="form-select"
                      id="difficulty"
                      name="difficulty"
                      [(ngModel)]="formData.difficulty"
                      required>
                      <option value="">Select difficulty</option>
                      <option *ngFor="let diff of difficulties" [value]="diff">{{ diff }}</option>
                    </select>
                  </div>
                  <div class="col-md-4 mb-3">
                    <label for="servings" class="form-label">Servings</label>
                    <input
                      type="number"
                      class="form-control"
                      id="servings"
                      name="servings"
                      [(ngModel)]="formData.servings"
                      min="1"
                      max="20"
                      required>
                  </div>
                </div>

                <!-- Ingredients Section -->
                <div class="mb-3">
                  <label for="ingredients" class="form-label">Ingredients (one per line)</label>
                  <textarea
                    class="form-control"
                    id="ingredients"
                    name="ingredients"
                    [(ngModel)]="ingredientsText"
                    rows="6"
                    required
                    placeholder="e.g.,&#10;2 cups flour&#10;1 tsp salt&#10;3 eggs"></textarea>
                  <small class="text-muted">Enter each ingredient on a new line</small>
                </div>

                <!-- Instructions Section -->
                <div class="mb-3">
                  <label for="instructions" class="form-label">Instructions (one per line)</label>
                  <textarea
                    class="form-control"
                    id="instructions"
                    name="instructions"
                    [(ngModel)]="instructionsText"
                    rows="8"
                    required
                    placeholder="e.g.,&#10;Preheat oven to 350°F&#10;Mix dry ingredients&#10;Add wet ingredients"></textarea>
                  <small class="text-muted">Enter each instruction on a new line</small>
                </div>

                <div class="text-center">
                  <button type="button" class="btn btn-secondary me-2" (click)="resetForm()">Reset</button>
                  <button type="submit" class="btn btn-warning text-dark" [disabled]="!editForm.form.valid">Update Recipe</button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <div class="card-footer text-center">
          <button class="btn btn-outline-secondary" (click)="goBack()">Back to Recipes</button>
        </div>
      </div>
    </div>
  </div>
</div>
